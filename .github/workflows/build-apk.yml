name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'ui/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build signed APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk wydarzenia-gieldowe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wydarzenia-gieldowe-apk
          path: wydarzenia-gieldowe.apk
      - name: Publish release "android"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android wydarzenia-gieldowe.apk \
            --title "Wydarzenia Giełdowe – Android, wersja ${GITHUB_RUN_NUMBER}" \
            --notes "Pobierz wydarzenia-gieldowe.apk i zainstaluj. Kolejne wersje instalują się jako aktualizacja, dane zostają."
