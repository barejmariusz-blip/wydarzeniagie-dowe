name: Build EXE

on:
  push:
    branches: [main]
    paths-ignore:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Ikona programu
        run: go run github.com/akavel/rsrc@v0.10.2 -ico icon.ico -arch amd64 -o rsrc_windows_amd64.syso
      - name: Build Windows EXE
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o WydarzeniaGieldowe.exe .
      - name: Instalator (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc "/DMyVersion=0.${{ github.run_number }}" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: WydarzeniaGieldowe-Windows
          path: |
            WydarzeniaGieldowe.exe
            dist/WydarzeniaGieldowe-Setup.exe
      - name: Publish release "windows"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows --yes --cleanup-tag || true
          gh release create windows dist/WydarzeniaGieldowe-Setup.exe WydarzeniaGieldowe.exe \
            --title "Wydarzenia Giełdowe – Windows, wersja ${GITHUB_RUN_NUMBER}" \
            --notes "WydarzeniaGieldowe-Setup.exe: instalator (menu Start, start z Windows, działanie w tle, widget na pulpicie). WydarzeniaGieldowe.exe: wersja przenośna bez instalacji. Dane zostają przy aktualizacji."
